<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>巡界 XUNJIE · 设备超级巡检人</title>
<meta name="description" content="巡界 XUNJIE · 设备超级巡检人">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070b14;
  --panel: #0f172a;
  --panel-2: #1e293b;
  --text: #f8fafc;
  --muted: #94a3b8;
  --amber: #f59e0b;
  --cyan: #06b6d4;
  --green: #10b981;
  --red: #ef4444;
  --ease-out-expo: cubic-bezier(0.22, 1, 0.36, 1);
  --slide-width: min(1200px, 92vw);
  --slide-height: min(720px, 85vh);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.6;
}

#app {
  width: 100%;
  height: 100%;
  perspective: 1400px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
    radial-gradient(ellipse at 80% 70%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
    var(--bg);
}

.xj-stage {
  position: relative;
  width: var(--slide-width);
  height: var(--slide-height);
  transform-style: preserve-3d;
}

.xj-slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 24px;
  background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(7, 11, 20, 0.98));
  border: 1px solid rgba(148, 163, 184, 0.12);
  box-shadow:
    0 40px 120px rgba(0, 0, 0, 0.6),
    0 0 0 1px rgba(255, 255, 255, 0.03) inset;
  padding: 48px 56px;
  overflow: hidden;
  transform-style: preserve-3d;
  transition:
    transform 0.85s var(--ease-out-expo),
    opacity 0.7s var(--ease-out-expo),
    filter 0.7s var(--ease-out-expo);
  backface-visibility: hidden;
  opacity: 0;
  pointer-events: none;
}

.xj-slide::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.4), transparent);
  opacity: 0.6;
}

.xj-slide.active {
  transform: translate3d(0, 0, 0) rotateY(0deg) scale(1);
  opacity: 1;
  filter: blur(0);
  pointer-events: auto;
  z-index: 10;
}

.xj-slide.prev {
  transform: translate3d(-65%, 0, -400px) rotateY(28deg) scale(0.86);
  opacity: 0.35;
  filter: blur(2px);
  z-index: 5;
}

.xj-slide.next {
  transform: translate3d(65%, 0, -400px) rotateY(-28deg) scale(0.86);
  opacity: 0.35;
  filter: blur(2px);
  z-index: 5;
}

.xj-slide.far {
  transform: translate3d(0, 0, -800px) scale(0.7);
  opacity: 0;
  filter: blur(6px);
  z-index: 1;
}

/* Inner animations */
.xj-slide.active .slide-layout__header,
.xj-slide.active .slide-cover__content,
.xj-slide.active .slide-ending__content {
  animation: fadeInUp 0.7s var(--ease-out-expo) 0.15s both;
}

.xj-slide.active .xj-grid,
.xj-slide.active .xj-pipeline,
.xj-slide.active .xj-breakchain,
.xj-slide.active .xj-demo,
.xj-slide.active .xj-arch,
.xj-slide.active .xj-compare,
.xj-slide.active .xj-completion,
.xj-slide.active .xj-table,
.xj-slide.active .xj-wow-chain,
.xj-slide.active .xj-metrics {
  animation: fadeInUp 0.7s var(--ease-out-expo) 0.25s both;
}

.xj-slide.active .xj-callout,
.xj-slide.active .slide-layout__footnote,
.xj-slide.active .xj-boundary,
.xj-slide.active .xj-data-footnote {
  animation: fadeInUp 0.7s var(--ease-out-expo) 0.4s both;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Cover */
.slide-cover,
.slide-ending {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.slide-cover__glow,
.slide-ending__glow {
  position: absolute;
  inset: -80px;
  background:
    radial-gradient(circle at 50% 40%, rgba(245, 158, 11, 0.18) 0%, transparent 45%),
    radial-gradient(circle at 70% 60%, rgba(6, 182, 212, 0.14) 0%, transparent 40%);
  filter: blur(40px);
  animation: pulseGlow 6s ease-in-out infinite;
}

@keyframes pulseGlow {
  0%, 100% { opacity: 0.8; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.05); }
}

.slide-cover__grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(148, 163, 184, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
  background-size: 48px 48px;
  transform: perspective(600px) rotateX(60deg) translateY(-60px) scale(1.8);
  opacity: 0.35;
  -webkit-mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
          mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
}

.slide-cover__content {
  position: relative;
  z-index: 2;
}

.slide-cover__eyebrow {
  font-size: 14px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 24px;
  font-weight: 600;
}

.slide-cover__title {
  font-size: clamp(64px, 10vw, 120px);
  font-weight: 900;
  margin: 0;
  line-height: 1;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, var(--text) 0%, var(--amber) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.slide-cover__en {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.55em;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--cyan);
  -webkit-text-fill-color: var(--cyan);
}

.slide-cover__subtitle {
  font-size: clamp(28px, 3.5vw, 44px);
  font-weight: 700;
  margin: 20px 0 0;
  color: var(--text);
}

.slide-cover__tagline {
  font-size: 18px;
  color: var(--muted);
  margin-top: 24px;
  max-width: 600px;
}

.slide-cover__footer {
  position: absolute;
  bottom: 32px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}

/* Layout */
.slide-layout {
  display: flex;
  flex-direction: column;
  height: 100%;
  gap: 24px;
}

.slide-layout__header {
  flex-shrink: 0;
}

.slide-layout__title {
  font-size: clamp(28px, 3.2vw, 40px);
  font-weight: 800;
  margin: 0 0 12px;
  line-height: 1.2;
}

.slide-layout__lead {
  font-size: 16px;
  color: var(--muted);
  max-width: 900px;
  line-height: 1.7;
  margin: 0;
}

.slide-layout__footnote {
  font-size: 12px;
  color: var(--muted);
  margin-top: auto;
  padding-top: 12px;
}

.slide-layout__footnote--right {
  text-align: right;
}

/* Text accents */
.text-amber { color: var(--amber); }
.text-cyan { color: var(--cyan); }
.text-green { color: var(--green); }
.text-red { color: var(--red); }

/* Cards */
.xj-grid {
  display: grid;
  gap: 20px;
}

.xj-grid--3 {
  grid-template-columns: repeat(3, 1fr);
}

.xj-card {
  background: rgba(30, 41, 59, 0.6);
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 16px;
  padding: 22px;
  position: relative;
  overflow: hidden;
  transition: transform 0.3s var(--ease-out-expo);
}

.xj-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--accent);
}

.xj-card--amber { --accent: var(--amber); }
.xj-card--cyan { --accent: var(--cyan); }
.xj-card--green { --accent: var(--green); }
.xj-card--red { --accent: var(--red); }

.xj-card__title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--text);
}

.xj-card__body {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.65;
}

/* Callout */
.xj-callout {
  padding: 18px 24px;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.5;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.xj-callout--amber {
  background: rgba(245, 158, 11, 0.1);
  border: 1px solid rgba(245, 158, 11, 0.25);
  color: var(--amber);
}

.xj-callout--cyan {
  background: rgba(6, 182, 212, 0.1);
  border: 1px solid rgba(6, 182, 212, 0.25);
  color: var(--cyan);
}

.xj-callout--green {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.25);
  color: var(--green);
}

.xj-callout--red {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.25);
  color: var(--red);
}

/* Break chain */
.xj-breakchain {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.xj-breakchain__item {
  background: rgba(30, 41, 59, 0.5);
  border: 1px solid rgba(239, 68, 68, 0.2);
  border-radius: 14px;
  padding: 18px;
  position: relative;
}

.xj-breakchain__num {
  position: absolute;
  top: -12px;
  left: 18px;
  width: 28px;
  height: 28px;
  background: var(--red);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
}

.xj-breakchain__title {
  font-weight: 700;
  margin: 12px 0 8px;
  color: var(--text);
}

.xj-breakchain__desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.55;
}

/* Pipeline */
.xj-pipeline {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.xj-step {
  background: rgba(30, 41, 59, 0.5);
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 14px;
  padding: 18px;
  position: relative;
}

.xj-step__num {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--green));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  margin-bottom: 12px;
}

.xj-step__title {
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text);
  font-size: 15px;
}

.xj-step__desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.55;
}

/* Demo flow */
.xj-demo {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.xj-demo__item {
  display: grid;
  grid-template-columns: 220px 40px 1fr;
  align-items: center;
  gap: 12px;
}

.xj-demo__input {
  background: rgba(30, 41, 59, 0.8);
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-radius: 12px;
  padding: 14px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--text);
  text-align: center;
}

.xj-demo__arrow {
  text-align: center;
  color: var(--cyan);
  font-size: 20px;
  font-weight: 700;
}

.xj-demo__response {
  background: rgba(30, 41, 59, 0.5);
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 14px;
  color: var(--muted);
}

.xj-demo__response--success {
  border-color: rgba(16, 185, 129, 0.35);
  background: rgba(16, 185, 129, 0.08);
}

.xj-demo__label {
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.xj-demo__response--success .xj-demo__label {
  color: var(--green);
}

/* Wow moment */
.xj-wow-input {
  background: rgba(6, 182, 212, 0.1);
  border: 1px solid rgba(6, 182, 212, 0.3);
  border-radius: 999px;
  padding: 18px 36px;
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(18px, 2.2vw, 28px);
  color: var(--cyan);
  text-align: center;
  margin: 0 auto 36px;
  display: inline-block;
  position: relative;
  left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 0 24px rgba(6, 182, 212, 0.15);
  animation: inputPulse 2.5s ease-in-out infinite;
}

@keyframes inputPulse {
  0%, 100% { box-shadow: 0 0 24px rgba(6, 182, 212, 0.15); }
  50% { box-shadow: 0 0 40px rgba(6, 182, 212, 0.3); }
}

.xj-wow-chain {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 28px;
}

.xj-wow-card {
  background: rgba(30, 41, 59, 0.5);
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  position: relative;
}

.xj-wow-card__icon {
  font-size: 36px;
  color: var(--cyan);
  margin-bottom: 12px;
  animation: iconPulse 2s ease-in-out infinite;
}

@keyframes iconPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.15); opacity: 0.85; }
}

.xj-wow-card--success {
  border-color: rgba(16, 185, 129, 0.35);
  background: rgba(16, 185, 129, 0.08);
}

.xj-wow-card--success .xj-wow-card__icon {
  color: var(--green);
}

.xj-wow-card__title {
  font-weight: 700;
  color: var(--text);
}

.xj-data-footnote {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 16px;
}

.xj-data-footnote code {
  font-family: 'JetBrains Mono', monospace;
  color: var(--cyan);
  background: rgba(6, 182, 212, 0.1);
  padding: 2px 6px;
  border-radius: 4px;
}

.xj-boundary {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  border: 1px dashed rgba(148, 163, 184, 0.25);
  padding: 10px 16px;
  border-radius: 8px;
}

/* Architecture */
.xj-arch {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.xj-arch__layer {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 18px;
  align-items: center;
  background: rgba(30, 41, 59, 0.5);
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 14px;
  padding: 18px 22px;
  position: relative;
  overflow: hidden;
}

.xj-arch__layer::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 5px;
}

.xj-arch__layer--1::before { background: var(--text); }
.xj-arch__layer--2::before { background: var(--cyan); }
.xj-arch__layer--3::before { background: var(--amber); }
.xj-arch__layer--4::before { background: var(--green); }

.xj-arch__title {
  font-weight: 800;
  font-size: 16px;
  color: var(--text);
}

.xj-arch__desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.6;
}

/* Compare */
.xj-compare {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 20px;
  align-items: stretch;
}

.xj-compare__col {
  background: rgba(30, 41, 59, 0.5);
  border-radius: 16px;
  padding: 24px;
  border: 1px solid;
}

.xj-compare__col--green {
  border-color: rgba(16, 185, 129, 0.25);
}

.xj-compare__col--red {
  border-color: rgba(239, 68, 68, 0.25);
}

.xj-compare__head {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 16px;
}

.xj-compare__col--green .xj-compare__head { color: var(--green); }
.xj-compare__col--red .xj-compare__head { color: var(--red); }

.xj-compare__list {
  margin: 0;
  padding-left: 20px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.9;
}

.xj-compare__gate {
  align-self: center;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--amber);
  padding: 16px 8px;
  border: 1px solid rgba(245, 158, 11, 0.3);
  border-radius: 999px;
  background: rgba(245, 158, 11, 0.08);
}

/* Completion */
.xj-completion {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 32px;
  align-items: center;
}

.xj-completion__list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.xj-checkitem {
  position: relative;
  padding-left: 28px;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
}

.xj-checkitem::before {
  content: '✓';
  position: absolute;
  left: 0;
  top: 0;
  width: 18px;
  height: 18px;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.35);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
}

.xj-completion__stats {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.xj-stat {
  text-align: center;
  background: rgba(30, 41, 59, 0.6);
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 16px;
  padding: 20px;
}

.xj-stat__num {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 42px;
  font-weight: 800;
  color: var(--green);
  line-height: 1;
  margin-bottom: 8px;
}

.xj-stat__label {
  font-size: 14px;
  color: var(--muted);
  font-weight: 600;
}

/* Table */
.xj-quote {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  text-align: center;
  padding: 14px;
  background: rgba(6, 182, 212, 0.08);
  border: 1px solid rgba(6, 182, 212, 0.2);
  border-radius: 12px;
}

.xj-scene-package {
  background: rgba(30, 41, 59, 0.5);
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 12px;
  padding: 14px 18px;
}

.xj-scene-package__title {
  font-weight: 700;
  color: var(--amber);
  margin-bottom: 6px;
}

.xj-scene-package__items {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
}

.xj-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.xj-table th,
.xj-table td {
  padding: 12px 14px;
  text-align: left;
  border-bottom: 1px solid rgba(148, 163, 184, 0.12);
}

.xj-table th {
  color: var(--amber);
  font-weight: 700;
  background: rgba(245, 158, 11, 0.06);
}

.xj-table td {
  color: var(--muted);
}

.xj-roadmap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 16px;
  background: rgba(30, 41, 59, 0.4);
  border-radius: 12px;
}

.xj-roadmap__item {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  padding: 10px 16px;
  background: rgba(15, 23, 42, 0.6);
  border-radius: 8px;
  border: 1px solid rgba(148, 163, 184, 0.15);
}

.xj-roadmap__arrow {
  color: var(--cyan);
  font-weight: 800;
  font-size: 18px;
}

/* PoC & metrics */
.xj-poc {
  display: flex;
  justify-content: center;
  gap: 16px;
}

.xj-poc__step {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(30, 41, 59, 0.6);
  border: 1px solid rgba(245, 158, 11, 0.2);
  border-radius: 12px;
  padding: 14px 18px;
  font-weight: 600;
  color: var(--text);
}

.xj-poc__step span {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--amber);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
}

.xj-metrics {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px;
}

.xj-metric {
  background: rgba(30, 41, 59, 0.5);
  border: 1px solid rgba(148, 163, 184, 0.12);
  border-radius: 12px;
  padding: 18px 12px;
  text-align: center;
}

.xj-metric__label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 8px;
  line-height: 1.4;
}

.xj-metric__trend {
  font-size: 28px;
  font-weight: 800;
  color: var(--green);
}

/* Ending */
.slide-ending__content {
  position: relative;
  z-index: 2;
  max-width: 860px;
}

.slide-ending__title {
  font-size: clamp(28px, 3.6vw, 44px);
  font-weight: 800;
  line-height: 1.3;
  margin: 0 0 24px;
}

.slide-ending__brand {
  font-size: 24px;
  font-weight: 700;
  color: var(--cyan);
  margin-bottom: 32px;
}

.slide-ending__boundary {
  font-size: 13px;
  color: var(--muted);
  border: 1px dashed rgba(148, 163, 184, 0.25);
  padding: 14px 18px;
  border-radius: 10px;
  margin-bottom: 32px;
}

.slide-ending__thanks {
  font-size: 18px;
  color: var(--amber);
  font-weight: 700;
}

/* Navigation hints */
.xj-nav {
  position: fixed;
  bottom: 20px;
  right: 24px;
  display: flex;
  gap: 10px;
  z-index: 100;
}

.xj-nav button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(148, 163, 184, 0.25);
  background: rgba(15, 23, 42, 0.7);
  color: var(--text);
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s var(--ease-out-expo);
  backdrop-filter: blur(8px);
}

.xj-nav button:hover {
  background: rgba(6, 182, 212, 0.2);
  border-color: var(--cyan);
}

.xj-progress {
  position: fixed;
  bottom: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--amber));
  transition: width 0.4s var(--ease-out-expo);
  z-index: 100;
}

.xj-page-number {
  position: fixed;
  bottom: 24px;
  left: 28px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  z-index: 100;
}

/* Responsive */
@media (max-width: 900px) {
  .xj-slide {
    padding: 28px;
  }

  .xj-grid--3,
  .xj-breakchain,
  .xj-pipeline,
  .xj-wow-chain,
  .xj-metrics {
    grid-template-columns: 1fr;
  }

  .xj-demo__item {
    grid-template-columns: 1fr;
  }

  .xj-demo__arrow {
    transform: rotate(90deg);
  }

  .xj-compare {
    grid-template-columns: 1fr;
  }

  .xj-compare__gate {
    writing-mode: horizontal-tb;
    text-align: center;
  }

  .xj-completion {
    grid-template-columns: 1fr;
  }

  .xj-poc {
    flex-direction: column;
    align-items: stretch;
  }

  .xj-roadmap {
    flex-direction: column;
  }
}

.xj-wow__c{

function initApp() {
  const app = document.getElementById("app");
  if (!app) {
    console.error("App element not found");
    return;
  }
  let current = 0;
  const total = slides.length;
  const stage = document.createElement("div");
  stage.className = "xj-stage";
  slides.forEach((slide, index) => {
    const el = document.createElement("div");
    el.className = "xj-slide";
    el.dataset.index = String(index);
    el.innerHTML = slide.render();
    stage.appendChild(el);
  });
  const progress = document.createElement("div");
  progress.className = "xj-progress";
  const pageNumber = document.createElement("div");
  pageNumber.className = "xj-page-number";
  const nav = document.createElement("div");
  nav.className = "xj-nav";
  nav.innerHTML = `
    <button class="xj-nav__prev" aria-label="上一页">‹</button>
    <button class="xj-nav__next" aria-label="下一页">›</button>
  `;
  app.appendChild(stage);
  app.appendChild(progress);
  app.appendChild(pageNumber);
  app.appendChild(nav);
  const slideEls = Array.from(stage.querySelectorAll(".xj-slide"));
  function updateSlides() {
    slideEls.forEach((el, index) => {
      el.classList.remove("active", "prev", "next", "far");
      if (index === current) {
        el.classList.add("active");
      } else if (index === current - 1) {
        el.classList.add("prev");
      } else if (index === current + 1) {
        el.classList.add("next");
      } else {
        el.classList.add("far");
      }
    });
    progress.style.width = `${(current + 1) / total * 100}%`;
    pageNumber.textContent = `${String(current + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
  }
  function goTo(index) {
    if (index < 0 || index >= total) return;
    current = index;
    updateSlides();
  }
  function next() {
    goTo(current + 1);
  }
  function prev() {
    goTo(current - 1);
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " " || e.key === "PageDown") {
      e.preventDefault();
      next();
    } else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") {
      e.preventDefault();
      prev();
    } else if (e.key === "Home") {
      e.preventDefault();
      goTo(0);
    } else if (e.key === "End") {
      e.preventDefault();
      goTo(total - 1);
    }
  });
  nav.querySelector(".xj-nav__prev")?.addEventListener("click", prev);
  nav.querySelector(".xj-nav__next")?.addEventListener("click", next);
  stage.addEventListener("click", (e) => {
    const rect = stage.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x > rect.width * 0.55) {
      next();
    } else if (x < rect.width * 0.45) {
      prev();
    }
  });
  updateSlides();
}


initApp();
})();

/* ---- 本地增强：T 切主题 · F 全屏 · ?p=N 直达 · ?export=1 导出模式 ---- */
(function(){
  var qs = new URLSearchParams(location.search);
  var root = document.documentElement;
  var themes = ["coze", "ci"];
  var ti = qs.get("theme") === "ci" ? 1 : 0;
  root.setAttribute("data-theme", themes[ti]);
  if (qs.get("export") === "1") root.setAttribute("data-export", "1");

  document.addEventListener("keydown", function(e){
    var k = e.key.toLowerCase();
    if (k === "t") {
      ti = (ti + 1) % themes.length;
      root.setAttribute("data-theme", themes[ti]);
    } else if (k === "f") {
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); }
      else { document.exitFullscreen(); }
    }
  });

  var hint = document.createElement("div");
  hint.className = "xj-hintbar";
  hint.textContent = "\u2190 \u2192 \u7ffb\u9875 \u00b7 F \u5168\u5c4f \u00b7 T \u5207\u4e3b\u9898";
  document.body.appendChild(hint);

  // ?p=N 直达指定页：复用翻页引擎的键盘通道，供无头浏览器逐页截图 / 分享定位
  var p = parseInt(qs.get("p"), 10);
  if (p > 1) {
    for (var i = 1; i < p; i++) {
      document.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight" }));
    }
  }
})();
