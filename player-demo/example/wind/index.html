<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>风电工程场景 · 巡界 XUNJIE</title>
    <style>
        html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body {
            font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        }

        /* Cesium 角标（ion logo/版权容器）隐藏：署名义务转移至仓库 UPSTREAM.md */
        .cesium-viewer-bottom { display: none !important; }

        .back-link {
            position: fixed;
            left: 12px;
            top: 12px;
            z-index: 9999;
            color: rgba(127, 163, 181, 0.75);
            background: rgba(13, 25, 35, 0.45);
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(120, 200, 230, 0.12);
            font-size: 11px;
            text-decoration: none;
            backdrop-filter: blur(4px);
            transition: color 150ms ease, border-color 150ms ease;
        }
        .back-link:hover { color: #d8f5ff; border-color: rgba(120, 200, 230, 0.35); }

        /* ══════════ AI 悬浮球 + 对话面板（样式向首页对齐：深色玻璃 + 细边 + 圆角胶囊） ══════════ */
        .assistant-shell {
            --ai-accent: #43c9e8;
            --ai-accent-2: #789fd9;
            --ai-hot: #d8f5ff;
            --ai-fg: #dceef6;
            --ai-muted: #7fa3b5;
            --ai-hairline: rgba(120, 200, 230, 0.1);
            --ai-warn: #e8a020;
            --font-mono: ui-monospace, Menlo, Consolas, monospace;
            position: fixed;
            inset: 0;
            z-index: 10000;
            pointer-events: none;
        }
        .assistant-shell > * { pointer-events: auto; }

        /* ---------- 悬浮球（外观动画原样保留） ---------- */
        .assistant-orb {
            position: absolute;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            z-index: 70;
            cursor: pointer;
            appearance: none;
            padding: 0;
            overflow: visible;
            isolation: isolate;
            background:
                radial-gradient(circle at 50% 44%, color-mix(in oklab, var(--orb-primary) 48%, transparent) 0 12%, color-mix(in oklab, var(--orb-primary) 18%, transparent) 34%, transparent 64%),
                conic-gradient(from 18deg, color-mix(in oklab, var(--orb-primary) 10%, transparent), color-mix(in oklab, var(--orb-secondary) 48%, transparent), color-mix(in oklab, var(--orb-primary) 9%, transparent) 48%, color-mix(in oklab, var(--orb-primary) 38%, transparent), color-mix(in oklab, var(--orb-primary) 10%, transparent));
            border: 1px solid color-mix(in oklab, var(--orb-primary) 64%, transparent);
            backdrop-filter: blur(10px);
            box-shadow:
                0 0 0 1px color-mix(in oklab, var(--orb-primary) 16%, transparent),
                0 0 18px color-mix(in oklab, var(--orb-primary) 26%, transparent),
                0 8px 22px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(235, 255, 255, 0.38),
                inset 0 -9px 18px rgba(0, 0, 0, 0.24);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eaffff;
            --orb-primary: #43c9e8;
            --orb-secondary: #789fd9;
            --orb-hot: #d8f5ff;
            transition: transform 180ms ease, border-color 180ms ease, filter 180ms ease, box-shadow 180ms ease, opacity 200ms ease;
        }
        /* 待机静默：平时半透明，环/轨道/粒子动画暂停（保留核心呼吸）；展开面板或 hover 时全亮 */
        .assistant-shell:not([data-open="true"]) .assistant-orb { opacity: 0.4; }
        .assistant-shell:not([data-open="true"]) .assistant-orb:hover { opacity: 0.8; }
        .assistant-shell:not([data-open="true"]) .assistant-orb::before,
        .assistant-shell:not([data-open="true"]) .assistant-orb::after,
        .assistant-shell:not([data-open="true"]) .assistant-orb__ring--outer,
        .assistant-shell:not([data-open="true"]) .assistant-orb__ring--inner,
        .assistant-shell:not([data-open="true"]) .assistant-orb__orbit,
        .assistant-shell:not([data-open="true"]) .assistant-orb__particle { animation-play-state: paused; }
        .assistant-orb:hover {
            transform: scale(1.08);
            filter: brightness(1.12) saturate(1.08);
            border-color: var(--orb-primary);
        }
        .assistant-orb.is-dragging {
            transform: scale(1.12);
            cursor: grabbing;
            filter: brightness(1.18) saturate(1.12);
            box-shadow:
                0 0 0 1px color-mix(in oklab, var(--orb-primary) 28%, transparent),
                0 0 30px color-mix(in oklab, var(--orb-primary) 42%, transparent),
                0 12px 26px rgba(0, 0, 0, 0.46),
                inset 0 1px 0 rgba(235, 255, 255, 0.5),
                inset 0 -9px 18px rgba(0, 0, 0, 0.2);
        }
        .assistant-orb::before,
        .assistant-orb::after {
            content: "";
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
        }
        .assistant-orb::before {
            inset: -7px;
            border: 1px solid color-mix(in oklab, var(--orb-primary) 33%, transparent);
            border-left-color: transparent;
            border-bottom-color: color-mix(in oklab, var(--orb-secondary) 54%, transparent);
            animation: assistant-orb-spin 8s linear infinite;
        }
        .assistant-orb::after {
            inset: -13px;
            border: 1px dashed color-mix(in oklab, var(--orb-primary) 17%, transparent);
            border-top-color: color-mix(in oklab, var(--orb-secondary) 42%, transparent);
            transform: rotate(-25deg);
            animation: assistant-orb-spin-reverse 13s linear infinite;
        }
        .assistant-orb__aura,
        .assistant-orb__ring,
        .assistant-orb__orbit,
        .assistant-orb__particle,
        .assistant-orb__core,
        .assistant-orb__glyph {
            position: absolute;
            pointer-events: none;
        }
        .assistant-orb__aura {
            inset: 8px;
            z-index: 0;
            border-radius: 50%;
            background: radial-gradient(circle, color-mix(in oklab, var(--orb-primary) 35%, transparent), transparent 68%);
            filter: blur(4px);
            animation: assistant-orb-pulse 2.8s ease-in-out infinite;
        }
        .assistant-orb__ring {
            inset: 2px;
            z-index: 1;
            border: 1px solid color-mix(in oklab, var(--orb-primary) 48%, transparent);
            border-radius: 50%;
        }
        .assistant-orb__ring--outer {
            border-top-color: transparent;
            border-right-color: color-mix(in oklab, var(--orb-secondary) 70%, transparent);
            transform: rotate(-20deg);
            animation: assistant-orb-spin 6s linear infinite;
        }
        .assistant-orb__ring--inner {
            inset: 9px;
            border-color: color-mix(in oklab, var(--orb-secondary) 48%, transparent);
            border-right-color: transparent;
            border-bottom-color: color-mix(in oklab, var(--orb-primary) 72%, transparent);
            animation: assistant-orb-spin-reverse 4.5s linear infinite;
        }
        .assistant-orb__orbit {
            left: 50%;
            top: 50%;
            width: 38px;
            height: 13px;
            z-index: 2;
            margin: -6.5px 0 0 -19px;
            border: 1px solid color-mix(in oklab, var(--orb-primary) 40%, transparent);
            border-radius: 50%;
        }
        .assistant-orb__orbit--one { transform: rotate(32deg); animation: assistant-orb-orbit 7s linear infinite; }
        .assistant-orb__orbit--two {
            border-color: color-mix(in oklab, var(--orb-secondary) 40%, transparent);
            transform: rotate(-32deg);
            animation: assistant-orb-orbit-reverse 9s linear infinite;
        }
        .assistant-orb__core {
            left: 50%;
            top: 50%;
            width: 23px;
            height: 23px;
            z-index: 3;
            margin: -11.5px 0 0 -11.5px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #f5ffff 0 8%, var(--orb-primary) 25%, color-mix(in oklab, var(--orb-primary) 42%, #07151c) 65%, #061219 100%);
            box-shadow: 0 0 8px color-mix(in oklab, var(--orb-primary) 86%, transparent), 0 0 20px color-mix(in oklab, var(--orb-primary) 48%, transparent);
        }
        .assistant-orb__core::before {
            content: "";
            position: absolute;
            inset: 3px;
            border: 1px solid rgba(238, 255, 255, 0.68);
            border-radius: 50%;
            opacity: 0.76;
            animation: assistant-orb-core-pulse 1.9s ease-in-out infinite;
        }
        .assistant-orb__core::after {
            content: "";
            position: absolute;
            left: 3px;
            right: 3px;
            top: 10px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(240, 255, 255, 0.9), transparent);
            animation: assistant-orb-scan 1.9s ease-in-out infinite;
        }
        .assistant-orb__core i {
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: rgba(238, 255, 255, 0.85);
            box-shadow: 0 0 8px rgba(238, 255, 255, 0.95);
        }
        .assistant-orb__glyph {
            left: 50%;
            top: 50%;
            z-index: 4;
            width: 18px;
            height: 18px;
            margin: -9px 0 0 -9px;
            color: #ecffff;
            filter: drop-shadow(0 0 5px color-mix(in oklab, var(--orb-primary) 82%, transparent));
            opacity: 0.9;
        }
        .assistant-orb__particle {
            width: 3px;
            height: 3px;
            z-index: 4;
            border-radius: 50%;
            background: var(--orb-hot);
            box-shadow: 0 0 6px color-mix(in oklab, var(--orb-hot) 90%, transparent);
        }
        .assistant-orb__particle--one { top: 5px; right: 14px; animation: assistant-orb-drift-one 3.2s ease-in-out infinite; }
        .assistant-orb__particle--two { left: 11px; bottom: 9px; animation: assistant-orb-drift-two 3.8s ease-in-out infinite; }

        @keyframes assistant-orb-spin { to { transform: rotate(340deg); } }
        @keyframes assistant-orb-spin-reverse { to { transform: rotate(-385deg); } }
        @keyframes assistant-orb-orbit {
            0%, 100% { transform: rotate(32deg) scaleX(1); }
            50% { transform: rotate(212deg) scaleX(0.86); }
        }
        @keyframes assistant-orb-orbit-reverse {
            0%, 100% { transform: rotate(-32deg) scaleX(1); }
            50% { transform: rotate(-212deg) scaleX(0.86); }
        }
        @keyframes assistant-orb-pulse {
            0%, 100% { opacity: 0.55; transform: scale(0.92); }
            50% { opacity: 0.95; transform: scale(1.06); }
        }
        @keyframes assistant-orb-core-pulse {
            0%, 100% { transform: scale(0.72); opacity: 0.46; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }
        @keyframes assistant-orb-scan {
            0%, 100% { transform: translateY(-5px); opacity: 0.2; }
            50% { transform: translateY(5px); opacity: 0.92; }
        }
        @keyframes assistant-orb-drift-one {
            0%, 100% { transform: translate(0, 0); opacity: 0.55; }
            50% { transform: translate(4px, -3px); opacity: 1; }
        }
        @keyframes assistant-orb-drift-two {
            0%, 100% { transform: translate(0, 0); opacity: 0.35; }
            50% { transform: translate(-3px, 4px); opacity: 0.95; }
        }
        @media (prefers-reduced-motion: reduce) {
            .assistant-orb *,
            .assistant-orb::before,
            .assistant-orb::after { animation: none !important; }
        }

        /* ---------- 对话面板：深色玻璃 + 顶部淡青微光 + 青→蓝紫渐变描边 ---------- */
        .assistant-panel {
            position: absolute;
            display: none;
            flex-direction: column;
            overflow: hidden;
            color: var(--ai-fg);
            border: 1px solid transparent;
            background:
                radial-gradient(ellipse 140% 55% at 50% -10%, rgba(67, 201, 232, 0.16), transparent 65%) padding-box,
                linear-gradient(rgba(13, 25, 35, 0.78), rgba(13, 25, 35, 0.78)) padding-box,
                linear-gradient(155deg, rgba(67, 201, 232, 0.6), rgba(120, 159, 217, 0.3) 55%, rgba(67, 201, 232, 0.15)) border-box;
            backdrop-filter: blur(10px);
            border-radius: 14px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45), 0 0 24px rgba(67, 201, 232, 0.06);
        }
        .assistant-shell[data-open="true"] .assistant-panel { display: flex; }

        .assistant-panel-head {
            flex: none;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 10px;
            cursor: move;
            user-select: none;
            border-bottom: 1px solid var(--ai-hairline);
        }
        /* 标题左侧发光点：呼应首页 wordmark 的青色光源 */
        .assistant-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex: none;
            background: var(--ai-accent);
            box-shadow: 0 0 6px rgba(67, 201, 232, 0.9), 0 0 14px rgba(67, 201, 232, 0.45);
            animation: assistant-dot-breathe 2.6s ease-in-out infinite;
        }
        @keyframes assistant-dot-breathe { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }
        .assistant-title { font-size: 12.5px; font-weight: 700; letter-spacing: 0.05em; }

        .ai-badge {
            display: inline-block;
            font-size: 10px;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .ai-badge-warn {
            border: 1px solid rgba(232, 160, 32, 0.45);
            color: var(--ai-warn);
            background: rgba(232, 160, 32, 0.1);
        }

        .assistant-head-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .capsule-btn {
            padding: 2px 10px;
            border-radius: 999px;
            border: 1px solid rgba(67, 201, 232, 0.4);
            background: rgba(67, 201, 232, 0.08);
            color: var(--ai-accent);
            font-size: 10.5px;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 150ms ease, color 150ms ease;
        }
        .capsule-btn:hover { border-color: rgba(67, 201, 232, 0.75); }
        .capsule-btn.off { color: var(--ai-muted); border-color: var(--ai-hairline); background: transparent; }

        .assistant-head-btn,
        .assistant-close {
            width: 22px;
            height: 22px;
            flex: none;
            border: none;
            background: none;
            color: var(--ai-muted);
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border-radius: 50%;
        }
        .assistant-head-btn:hover,
        .assistant-close:hover { color: var(--ai-fg); }
        .assistant-head-btn[aria-pressed="true"] { color: var(--ai-accent); }
        .assistant-head-btn:disabled { color: var(--ai-muted); opacity: 0.45; cursor: not-allowed; }
        .assistant-close { font-size: 17px; }

        .assistant-msgs {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            scrollbar-width: thin;
            scrollbar-color: rgba(120, 200, 230, 0.22) transparent;
        }

        .assistant-quick { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 10px 6px; flex: none; }
        .assistant-quick button {
            font-size: 11px;
            color: var(--ai-muted);
            background: transparent;
            border: 1px solid var(--ai-hairline);
            border-radius: 999px;
            padding: 2px 9px;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: border-color 150ms ease, color 150ms ease;
        }
        .assistant-quick button:hover { color: var(--ai-accent); border-color: rgba(67, 201, 232, 0.55); }

        /* ---------- 消息流（聊天 App 布局：气泡自适应内容宽度，用户右对齐 / AI 左对齐） ---------- */
        .ai-msg { display: flex; gap: 6px; align-items: flex-start; }
        .ai-msg.user { flex-direction: row-reverse; }
        .ai-av {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10.5px;
        }
        .ai-msg.bot .ai-av {
            background: rgba(67, 201, 232, 0.1);
            color: var(--ai-accent);
            border: 1px solid rgba(67, 201, 232, 0.35);
        }
        .ai-msg.user .ai-av { background: rgba(120, 200, 230, 0.1); color: var(--ai-muted); }
        .ai-bubble {
            flex: 0 1 auto;
            width: fit-content;
            max-width: 78%;
            min-width: 0;
            padding: 5px 9px;
            border-radius: 10px;
            border: 1px solid var(--ai-hairline);
            background: rgba(16, 32, 44, 0.5);
        }
        /* 卡片气泡（风机信息 / 维修记录卡）保持宽版，不随文本收缩 */
        .ai-bubble-card { width: 100%; max-width: 96%; }
        .ai-msg.user .ai-bubble {
            background: rgba(67, 201, 232, 0.09);
            border-color: rgba(67, 201, 232, 0.24);
        }
        .ai-tx {
            margin: 0;
            font-size: 12px;
            line-height: 1.65;
            color: var(--ai-fg);
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* 系统气泡（场景就绪 / 键位提示 / 维修步骤留痕）：紧凑胶囊居中 */
        .ai-msg.sys { justify-content: center; }
        .ai-msg.sys .ai-bubble {
            flex: none;
            max-width: 100%;
            padding: 3px 11px;
            border-radius: 999px;
            border-style: dashed;
            background: rgba(13, 25, 35, 0.4);
        }
        .ai-msg.sys .ai-tx { font-size: 11px; color: var(--ai-muted); }
        .ai-time { font-family: var(--font-mono); color: rgba(67, 201, 232, 0.6); margin-right: 6px; }

        .ai-cmds { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
        .cmd-chip {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 999px;
            background: rgba(67, 201, 232, 0.09);
            border: 1px solid rgba(67, 201, 232, 0.32);
            color: var(--ai-accent);
            font-size: 10.5px;
            font-family: var(--font-mono);
        }

        /* 面板内卡片（风机信息 / 维修记录卡气泡） */
        .ai-card {
            border: 1px solid var(--ai-hairline);
            border-radius: 10px;
            background: rgba(10, 20, 28, 0.45);
            padding: 8px 10px;
        }
        .ai-card-title {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ai-card-row { font-size: 11.5px; color: var(--ai-fg); line-height: 1.75; word-break: break-all; }
        .ai-card-row .k { color: var(--ai-muted); display: inline-block; min-width: 76px; }
        .ai-card-steps { margin: 4px 0 0; padding-left: 17px; font-size: 11px; color: var(--ai-muted); line-height: 1.75; }
        .ai-card-action { margin-top: 7px; }

        #cmd-form {
            flex: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-top: 1px solid var(--ai-hairline);
            margin: 0;
        }
        #cmd-input {
            flex: 1;
            min-width: 0;
            height: 28px;
            background: rgba(10, 20, 28, 0.55);
            border: 1px solid var(--ai-hairline);
            border-radius: 999px;
            color: var(--ai-fg);
            font-size: 12px;
            padding: 0 10px;
            outline: none;
        }
        #cmd-input:focus { border-color: rgba(67, 201, 232, 0.5); }
        #cmd-input::placeholder { color: rgba(127, 163, 181, 0.55); font-size: 11px; }
        /* 发送：青色实心圆按钮（图标） */
        #cmd-send {
            width: 28px;
            height: 28px;
            flex: none;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #5fd6f0, #2fb3d4);
            color: #052730;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1px 1px 0;
            box-shadow: 0 2px 10px rgba(67, 201, 232, 0.35);
            transition: filter 150ms ease, transform 150ms ease;
        }
        #cmd-send:hover { filter: brightness(1.12); transform: scale(1.08); }
        /* 语音输入：按住说话（豆包 ASR） */
        #cmd-mic {
            width: 28px;
            height: 28px;
            flex: none;
            border-radius: 50%;
            border: 1px solid rgba(67, 201, 232, 0.45);
            background: transparent;
            color: #5fd6f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 150ms ease, color 150ms ease;
        }
        #cmd-mic:hover { background: rgba(67, 201, 232, 0.12); }
        #cmd-mic.recording {
            background: #ff5d5d;
            border-color: #ff5d5d;
            color: #fff;
            animation: mic-pulse 1s ease-in-out infinite;
        }
        #cmd-mic:disabled { opacity: 0.35; cursor: default; }
        @keyframes mic-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 93, 93, 0.45); }
            50% { box-shadow: 0 0 0 6px rgba(255, 93, 93, 0); }
        }

        @media (max-width: 900px) {
            .assistant-panel { max-width: calc(100vw - 16px); }
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <a class="back-link" href="../">← 返回首页</a>

    <!-- AI 悬浮球 + 对话面板（指挥唯一入口） -->
    <div class="assistant-shell" id="ai-shell" data-open="false">
        <section class="assistant-panel" id="ai-panel" aria-label="巡界 AI 助手">
            <header class="assistant-panel-head" id="ai-panel-head">
                <span class="assistant-dot" aria-hidden="true"></span>
                <span class="assistant-title">巡界 AI 助手</span>
                <div class="assistant-head-actions">
                    <button type="button" class="assistant-head-btn" id="ai-tts"
                        aria-label="语音播报开关" title="语音播报：开（浏览器本地 TTS）" aria-pressed="true">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="9" y="3" width="6" height="12" rx="3" />
                            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7" />
                        </svg>
                    </button>
                    <button type="button" class="assistant-close" id="ai-close" aria-label="收起">×</button>
                </div>
            </header>
            <div class="assistant-msgs" id="ai-msgs"></div>
            <div class="assistant-quick" id="ai-quick">
                <button type="button" data-q="飞到 7 号风机">飞到 7 号风机</button>
                <button type="button" data-q="查看 5 号风机">查看 5 号风机</button>
                <button type="button" data-q="回运维点">回运维点</button>
            </div>
            <form id="cmd-form" autocomplete="off">
                <input id="cmd-input" type="text" maxlength="1000"
                    placeholder="指挥数字运维员：导航 / 维修 / 查看…" />
                <button id="cmd-mic" type="button" aria-label="按住说话" title="按住说话（豆包语音识别）">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="9" y="3" width="6" height="12" rx="3" />
                        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M8.5 21h7" />
                    </svg>
                </button>
                <button id="cmd-send" type="submit" aria-label="发送">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M3.4 20.4 20.8 12.9c.8-.35.8-1.45 0-1.8L3.4 3.6c-.66-.29-1.39.2-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z" />
                    </svg>
                </button>
            </form>
        </section>
        <button type="button" class="assistant-orb" id="ai-orb" aria-expanded="false" aria-label="打开巡界 AI 助手">
            <span class="assistant-orb__aura" aria-hidden="true"></span>
            <span class="assistant-orb__ring assistant-orb__ring--outer" aria-hidden="true"></span>
            <span class="assistant-orb__ring assistant-orb__ring--inner" aria-hidden="true"></span>
            <span class="assistant-orb__orbit assistant-orb__orbit--one" aria-hidden="true"></span>
            <span class="assistant-orb__orbit assistant-orb__orbit--two" aria-hidden="true"></span>
            <span class="assistant-orb__particle assistant-orb__particle--one" aria-hidden="true"></span>
            <span class="assistant-orb__particle assistant-orb__particle--two" aria-hidden="true"></span>
            <span class="assistant-orb__core" aria-hidden="true"><i></i></span>
            <svg class="assistant-orb__glyph" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3 L13.6 9.4 L20 11 L13.6 12.6 L12 19 L10.4 12.6 L4 11 L10.4 9.4 Z"
                    stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            </svg>
        </button>
    </div>

    <script type="module" src="./index.ts"></script>
</body>
</html>
