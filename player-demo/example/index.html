<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>巡界 XUNJIE · 设备超级巡检人</title>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>" />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --accent: #43c9e8;
                --accent-2: #789fd9;
                --hot: #d8f5ff;
                --text: #dceef6;
                --muted: #7fa3b5;
                --hairline: rgba(120, 200, 230, 0.16);
                --panel: rgba(13, 25, 35, 0.66);
                --warn: #e8a020;
            }

            html,
            body {
                background: #0a141c;
            }

            body {
                min-height: 100vh;
                color: var(--text);
                font-family:
                    "PingFang SC",
                    "HarmonyOS Sans SC",
                    "Microsoft YaHei",
                    system-ui,
                    -apple-system,
                    sans-serif;
                overflow-x: hidden;
            }

            /* 动态背景画布：粒子流场 + 点阵数字孪生人 */
            #twin-bg {
                position: fixed;
                inset: 0;
                z-index: 0;
                display: block;
            }

            .page {
                position: relative;
                z-index: 1;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 0 2rem 3.5rem;
            }

            /* ── 顶栏 ── */
            .topbar {
                width: 100%;
                max-width: 1200px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 1.1rem 0;
            }
            .wordmark {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                font-weight: 800;
                letter-spacing: 0.12em;
                font-size: 0.95rem;
            }
            .wordmark .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: radial-gradient(circle at 35% 30%, #f5ffff 0 12%, var(--accent) 45%, #1b6d84 100%);
                box-shadow: 0 0 10px rgba(67, 201, 232, 0.8);
            }
            .github-link {
                display: inline-flex;
                align-items: center;
                gap: 0.45rem;
                color: var(--muted);
                text-decoration: none;
                font-size: 0.82rem;
                transition: color 0.15s;
            }
            .github-link:hover {
                color: var(--hot);
            }
            .github-link svg {
                width: 20px;
                height: 20px;
            }

            /* ── Hero ── */
            .hero {
                width: 100%;
                max-width: 1200px;
                padding: 4.4rem 0 3.4rem;
                text-align: center;
            }
            .hero-eyebrow {
                font-size: 0.78rem;
                letter-spacing: 0.32em;
                color: var(--accent);
                text-transform: uppercase;
                margin-bottom: 1rem;
            }
            h1 {
                font-size: clamp(2rem, 5vw, 3.2rem);
                font-weight: 900;
                letter-spacing: 0.08em;
                background: linear-gradient(120deg, #f2fbff 20%, var(--accent) 55%, var(--accent-2) 90%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                margin-bottom: 1rem;
            }
            .hero-desc {
                font-size: 0.95rem;
                color: var(--muted);
                max-width: 800px;
                margin: 0 auto;
                line-height: 1.9;
            }
            .hero-desc em {
                font-style: normal;
                color: var(--warn);
            }

            /* ── 场景卡片 ── */
            .grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr); /* 三场景平级等大 */
                gap: 1.2rem;
                width: 100%;
                max-width: 1200px;
                margin-top: 2.2rem;
            }
            @media (max-width: 900px) {
                .grid {
                    grid-template-columns: 1fr;
                }
            }
            .card {
                position: relative;
                background: rgba(16, 32, 44, 0.22);
                backdrop-filter: blur(14px) saturate(1.5);
                -webkit-backdrop-filter: blur(14px) saturate(1.5);
                border-radius: 14px;
                overflow: hidden;
                text-decoration: none;
                color: var(--text);
                display: flex;
                flex-direction: column;
                aspect-ratio: 4/3;
                border: 1px solid rgba(120, 200, 230, 0.14);
                transition:
                    transform 0.18s ease,
                    box-shadow 0.18s ease,
                    border-color 0.18s ease,
                    background 0.18s ease;
                opacity: 0;
                animation: rise 0.4s ease forwards;
            }
            .card-thumb,
            .card-info {
                opacity: 0.94;
                transition:
                    opacity 0.18s ease,
                    filter 0.18s ease;
            }
            .card:hover {
                transform: translateY(-4px);
                background: rgba(20, 40, 54, 0.5);
                border-color: rgba(67, 201, 232, 0.55);
                box-shadow:
                    0 14px 40px rgba(0, 0, 0, 0.45),
                    0 0 24px rgba(67, 201, 232, 0.18);
            }
            .card:hover .card-thumb,
            .card:hover .card-info {
                opacity: 1;
            }
            .card:nth-child(1) { animation-delay: 0.05s; }
            .card:nth-child(2) { animation-delay: 0.12s; }
            .card:nth-child(3) { animation-delay: 0.19s; }

            .card-thumb {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: flex-end;
                padding: 1rem 1.2rem;
                position: relative;
                overflow: hidden;
            }
            .card-thumb .scene-no {
                position: absolute;
                top: 0.4rem;
                right: 0.9rem;
                font-size: 3.2rem;
                font-weight: 900;
                color: rgba(255, 255, 255, 0.14);
                letter-spacing: 0.04em;
            }
            .card-thumb .scene-kind {
                font-size: 0.72rem;
                letter-spacing: 0.28em;
                color: rgba(255, 255, 255, 0.75);
                margin-bottom: 0.3rem;
            }
            .card-thumb .scene-name {
                font-size: 1.35rem;
                font-weight: 800;
                letter-spacing: 0.05em;
                color: #fff;
                text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
            }
            .thumb-hydro {
                background:
                    radial-gradient(420px 200px at 80% 0%, rgba(216, 245, 255, 0.16), transparent 60%),
                    linear-gradient(150deg, rgba(24, 74, 116, 0.66) 0%, rgba(17, 114, 143, 0.6) 55%, rgba(14, 150, 168, 0.66) 100%);
            }
            .thumb-wind {
                background:
                    radial-gradient(420px 200px at 80% 0%, rgba(216, 245, 255, 0.16), transparent 60%),
                    linear-gradient(150deg, rgba(38, 135, 171, 0.68) 0%, rgba(25, 100, 133, 0.6) 48%, rgba(15, 134, 97, 0.68) 100%);
            }
            .thumb-pv {
                background:
                    radial-gradient(420px 200px at 80% 0%, rgba(255, 240, 200, 0.16), transparent 60%),
                    linear-gradient(150deg, rgba(148, 100, 20, 0.66) 0%, rgba(192, 128, 28, 0.58) 45%, rgba(74, 108, 152, 0.66) 100%);
            }

            .card-info {
                padding: 0.85rem 1.2rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.6rem;
                border-top: 1px solid var(--hairline);
            }
            .card-meta {
                display: flex;
                flex: 1;
                flex-direction: row;
                align-items: baseline;
                justify-content: center;
                gap: 0.5em;
                min-width: 0;
                white-space: nowrap;
            }
            .card-tag {
                font-size: 1.28rem;
                letter-spacing: 0.1em;
                color: var(--muted);
                line-height: 1.5;
            }
            .play-btn {
                width: 2rem;
                height: 2rem;
                border-radius: 50%;
                background: var(--accent);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                box-shadow: 0 2px 10px rgba(67, 201, 232, 0.4);
                transition: transform 0.15s;
            }
            .card:hover .play-btn {
                transform: scale(1.12);
            }
            .play-btn svg {
                width: 10px;
                height: 10px;
                fill: #04222c;
                margin-left: 2px;
            }

            /* 封面特征图案（SVG 装饰层） */
            .thumb-art {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }
            .thumb-wind .rotor {
                transform-box: fill-box;
                transform-origin: center;
                animation: rotor-spin 7s linear infinite;
            }
            .thumb-wind .rotor-2 {
                animation-duration: 9s;
                animation-direction: reverse;
            }
            @keyframes rotor-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .thumb-hydro .wave {
                animation: wave-drift 10s linear infinite;
            }
            .thumb-hydro .wave-2 {
                animation-duration: 14s;
                animation-direction: reverse;
            }
            @keyframes wave-drift {
                from {
                    transform: translateX(0);
                }
                to {
                    transform: translateX(-104px);
                }
            }
            .thumb-pv .sun {
                animation: sun-pulse 5s ease-in-out infinite;
            }
            .thumb-pv .sun-rays {
                transform-box: fill-box;
                transform-origin: center;
                animation: rays-spin 28s linear infinite;
            }
            @keyframes rays-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @keyframes sun-pulse {
                0%,
                100% {
                    opacity: 0.5;
                }
                50% {
                    opacity: 0.9;
                }
            }

            /* 未开放卡片：外观与开放卡一致，仅无点击行为 */
            .card.wip {
                cursor: default;
            }
            .card.wip:hover {
                transform: none;
                background: rgba(16, 32, 44, 0.22);
                border-color: rgba(120, 200, 230, 0.14);
                box-shadow: none;
            }
            .card.wip:hover .card-thumb,
            .card.wip:hover .card-info {
                opacity: 0.94;
            }

            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(14px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>

        <script>
            // 动态背景：粒子流场（呼应场景内的 GPU 风场流线）+ 点阵数字孪生人 + 漂移指令文字（大模型操控意象）
            // 纯 canvas 2D，无依赖；prefers-reduced-motion 时只画一帧静态。
            (() => {
                const canvas = document.getElementById("twin-bg");
                const ctx = canvas.getContext("2d");
                const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                let w = 0,
                    h = 0,
                    dpr = 1;

                function resize() {
                    dpr = Math.min(window.devicePixelRatio || 1, 2);
                    w = window.innerWidth;
                    h = window.innerHeight;
                    canvas.width = w * dpr;
                    canvas.height = h * dpr;
                    canvas.style.width = w + "px";
                    canvas.style.height = h + "px";
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    ctx.fillStyle = "#0a141c";
                    ctx.fillRect(0, 0, w, h);
                }
                resize();
                window.addEventListener("resize", resize);

                // —— 流场角度：廉价伪噪声（sin/cos 叠加），整体向右流动 ——
                const field = (x, y, t) =>
                    Math.sin(x * 0.0021 + t * 0.18) * 1.1 +
                    Math.cos(y * 0.0024 - t * 0.13) * 0.9 +
                    Math.sin((x + y) * 0.0009 + t * 0.05) * 0.6;

                // —— 粒子 ——
                const N = 240;
                const parts = [];
                const spawn = (p) => {
                    p.x = Math.random() * w;
                    p.y = Math.random() * h;
                    p.px = p.x;
                    p.py = p.y;
                    p.life = 120 + Math.random() * 200;
                    p.speed = 0.4 + Math.random() * 0.9;
                    p.hue = Math.random() < 0.85 ? "67,201,232" : "216,245,255";
                };
                for (let i = 0; i < N; i++) {
                    const p = {};
                    spawn(p);
                    p.life = Math.random() * 300;
                    parts.push(p);
                }

                // —— 点阵数字孪生人（骨架采样点，归一化坐标；右臂微抬作指挥状） ——
                const segs = [];
                const seg = (x1, y1, x2, y2, n) => {
                    for (let i = 0; i <= n; i++) segs.push([x1 + (x2 - x1) * (i / n), y1 + (y2 - y1) * (i / n)]);
                };
                for (let i = 0; i < 16; i++) {
                    const a = (i / 16) * Math.PI * 2;
                    segs.push([Math.cos(a) * 0.07, -0.62 + Math.sin(a) * 0.07]); // 头
                }
                seg(0, -0.54, 0, -0.5, 2); // 颈
                seg(0, -0.5, 0, -0.1, 12); // 脊柱
                seg(-0.14, -0.46, 0.14, -0.46, 8); // 肩
                seg(-0.14, -0.46, -0.2, -0.2, 6); // 左大臂
                seg(-0.2, -0.2, -0.16, 0.02, 5); // 左小臂
                seg(0.14, -0.46, 0.26, -0.3, 6); // 右大臂（抬）
                seg(0.26, -0.3, 0.38, -0.22, 5); // 右小臂（前指）
                seg(-0.07, -0.1, 0.07, -0.1, 4); // 髋
                seg(-0.07, -0.1, -0.09, 0.18, 7); // 左大腿
                seg(-0.09, 0.18, -0.1, 0.46, 6); // 左小腿
                seg(0.07, -0.1, 0.1, 0.18, 7); // 右大腿
                seg(0.1, 0.18, 0.12, 0.46, 6); // 右小腿
                const figure = segs.map(([x, y], i) => ({ x, y, ph: i * 0.7 }));

                // —— 漂移指令文字（大模型下发的高层命令意象） ——
                const PHRASES = ["飞到 7 号风机", "维修 7 号风机", "查看 5 号风机", "回运维点", "左转 90 度", "停下", "navigate → CP-WT-07", "repair_simulation", "focus_asset", "trace: 解释 → 执行"];
                const whispers = [];
                let whisperTimer = 0;

                let t = 0;
                function frame() {
                    t += 0.016;
                    // 拖尾：半透明底色覆盖
                    ctx.fillStyle = "rgba(10,20,28,0.085)";
                    ctx.fillRect(0, 0, w, h);

                    // 粒子流线
                    ctx.lineWidth = 1;
                    for (const p of parts) {
                        const a = field(p.x, p.y, t);
                        p.px = p.x;
                        p.py = p.y;
                        p.x += Math.cos(a) * p.speed * 1.6;
                        p.y += Math.sin(a) * p.speed * 1.6 + 0.12;
                        p.life--;
                        if (p.life <= 0 || p.x < -20 || p.x > w + 20 || p.y < -20 || p.y > h + 20) {
                            spawn(p);
                            continue;
                        }
                        const alpha = Math.min(0.34, (p.life / 300) * 0.4);
                        ctx.strokeStyle = `rgba(${p.hue},${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(p.px, p.py);
                        ctx.lineTo(p.x, p.y);
                        ctx.stroke();
                    }

                    // 数字孪生人：右侧，呼吸浮动 + 扫描环
                    const s = Math.min(w, h) * 0.52;
                    const cx = w * 0.79;
                    const cy = h * 0.46 + Math.sin(t * 1.1) * 5;
                    const ringR = s * (0.62 + 0.05 * Math.sin(t * 0.9));
                    ctx.strokeStyle = "rgba(67,201,232,0.10)";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(cx, cy - s * 0.08, ringR, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = "rgba(67,201,232,0.05)";
                    ctx.beginPath();
                    ctx.arc(cx, cy - s * 0.08, ringR * 1.18, 0, Math.PI * 2);
                    ctx.stroke();
                    for (const d of figure) {
                        const jx = Math.sin(t * 2.2 + d.ph) * 0.004;
                        const jy = Math.cos(t * 1.7 + d.ph * 1.3) * 0.004;
                        const x = cx + (d.x + jx) * s;
                        const y = cy + (d.y + jy) * s;
                        const glow = 0.28 + 0.22 * Math.sin(t * 2 + d.ph);
                        ctx.fillStyle = `rgba(120,220,245,${glow * 0.35})`;
                        ctx.beginPath();
                        ctx.arc(x, y, 3.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = `rgba(190,240,255,${glow})`;
                        ctx.beginPath();
                        ctx.arc(x, y, 1.3, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 指令文字：从右侧流入，随场漂移，淡入淡出
                    whisperTimer--;
                    if (whisperTimer <= 0 && whispers.length < 4) {
                        whispers.push({
                            text: PHRASES[Math.floor(Math.random() * PHRASES.length)],
                            x: w + 40,
                            y: h * (0.12 + Math.random() * 0.72),
                            age: 0,
                            ttl: 900 + Math.random() * 300,
                        });
                        whisperTimer = 200 + Math.random() * 260;
                    }
                    ctx.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
                    for (let i = whispers.length - 1; i >= 0; i--) {
                        const ws = whispers[i];
                        const a = field(ws.x, ws.y, t);
                        ws.x += Math.cos(a) * 0.7 - 0.5;
                        ws.y += Math.sin(a) * 0.4;
                        ws.age++;
                        const fade = Math.min(1, ws.age / 120, (ws.ttl - ws.age) / 160);
                        if (ws.age > ws.ttl || ws.x < -200) {
                            whispers.splice(i, 1);
                            continue;
                        }
                        ctx.fillStyle = `rgba(67,201,232,${0.42 * fade})`;
                        ctx.fillText("› " + ws.text, ws.x, ws.y);
                    }

                    if (!reduced) requestAnimationFrame(frame);
                }
                frame();
            })();
        </script>
    </body>
</html>
